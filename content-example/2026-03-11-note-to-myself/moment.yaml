date: 2026-03-11
title:
  zh: 给自己的备忘
  en: Note to Myself
description:
  zh: |-
    别再把"以后"当成一个保证。
    想见的人这周就约，想学的东西从笨拙的第一小时开始。
    日子是过出来的，不是攒出来的。
  en: |-
    Stop treating "someday" as a guarantee.
    Invite that person this week; begin the new thing with its first, clumsy hour.
    Days are spent, not saved up.
